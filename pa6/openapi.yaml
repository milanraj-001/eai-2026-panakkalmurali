openapi: 3.0.3
info:
  title: Checkout Orchestrator API
  version: 1.0.0
  description: >-
    Runs one checkout as a saga over four downstream services. Payment is
    authorised, inventory is reserved, shipping is created and the customer is
    notified, strictly one after the other. When a step fails or times out, the
    steps that already completed and have a compensating action are undone in
    reverse order, inventory first and then payment. The request body is a
    canonical order. The orchestrator derives the amount to charge from its
    items and sends the notification to the customer's email address. Repeating
    a request with the same Idempotency-Key never runs the saga twice. The
    ungraded debug endpoint is not part of this contract.
servers:
  - url: http://localhost:3000
    description: The orchestrator as started by docker compose on a developer machine.
tags:
  - name: checkout
    description: The checkout saga and its idempotency rules.
  - name: operations
    description: Health checks for the running service.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [operations]
      summary: Check that the service is up
      description: Returns 200 while the orchestrator process is running and able to answer requests.
      responses:
        "200":
          description: The orchestrator is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Run the checkout saga for one order
      description: >-
        Calls payment, inventory, shipping and notification in that order. Each
        call starts only after the previous one succeeded. A call that does not
        answer within the configured request timeout counts as a timeout. On a
        failure or a timeout, completed payment and inventory steps are
        compensated in reverse order. Shipping and notification have no
        compensating action. The response carries a trace of every call made,
        compensation calls included. Replaying a request with the same key and
        the same body returns the first response unchanged, with the same
        status code, and does not call any downstream service again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            A client-chosen key that identifies this checkout attempt. Reusing
            it with an identical body replays the first result. Reusing it with
            a different body, or while the first request is still running, is
            rejected with 409.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        description: >-
          The order to check out, in the canonical order shape. It carries no
          amount. The orchestrator charges the sum of unitPrice times quantity
          over all items.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutOrder"
      responses:
        "200":
          description: All four steps succeeded and the order is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutCompleted"
        "400":
          description: The Idempotency-Key is missing or out of bounds, or the body is not a valid order with 1 to 100 items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The Idempotency-Key was already used with a different body, or the
            first request with this key is still running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            A step failed for a business reason. The status is compensated when
            all compensation succeeded, and failed when payment itself failed or
            a compensation call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutFailure"
        "504":
          description: >-
            A step did not answer within the request timeout. Completed steps
            were compensated where possible, and the code is timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutFailure"
components:
  schemas:
    HealthStatus:
      type: object
      description: Liveness payload.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok when the service can answer.
          enum: [ok]
    Address:
      type: object
      description: Where the order is delivered.
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: Street name and house number.
          minLength: 1
        city:
          type: string
          description: City or town.
          minLength: 1
        postalCode:
          type: string
          description: Postal code in the format of the country, for example LV-1001.
          minLength: 1
        country:
          type: string
          description: Two-letter ISO 3166-1 country code.
          pattern: '^[A-Z]{2}$'
    Customer:
      type: object
      description: The person who placed the order.
      additionalProperties: false
      required: [name, email, address]
      properties:
        name:
          type: string
          description: Full name. Diacritics are kept as sent.
          minLength: 1
        email:
          type: string
          description: Address that receives the completion notification.
          format: email
        address:
          $ref: "#/components/schemas/Address"
    OrderItem:
      type: object
      description: One priced line on the order.
      additionalProperties: false
      required: [productId, productName, quantity, unitPrice, currency, taxRate]
      properties:
        productId:
          type: string
          description: Product id in the pricing format, for example PROD-001.
          pattern: '^PROD-[0-9]+$'
        productName:
          type: string
          description: Name of the product as shown to the customer.
          minLength: 1
        quantity:
          type: integer
          description: How many units were ordered.
          minimum: 1
        unitPrice:
          type: string
          description: Price of one unit as a decimal string with two fraction digits. It is never a JSON number.
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          description: Three-letter ISO 4217 code of the unit price.
          pattern: '^[A-Z]{3}$'
        taxRate:
          type: number
          description: Tax rate as a fraction, so 0.21 means 21 percent.
          minimum: 0
          maximum: 1
    CheckoutOrder:
      type: object
      description: >-
        The canonical order, restated here because the canonical schema leaves
        its items array unbounded. This contract allows at most 100 items and
        the orchestrator enforces that bound in code.
      additionalProperties: false
      required: [orderId, orderType, source, receivedAt, orderDate, customer, items, currency, status]
      properties:
        orderId:
          type: string
          description: Order id assigned by the source system.
          minLength: 1
        orderType:
          type: string
          description: Kind of order.
          enum: [standard, express, b2b]
        source:
          type: string
          description: The channel the order came from.
          enum: [web, mobile, b2b]
        receivedAt:
          type: string
          description: When the order was translated into this canonical form.
          format: date-time
        orderDate:
          type: string
          description: When the customer placed the order, in UTC.
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        items:
          type: array
          description: The order lines. At least 1 and at most 100.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OrderItem"
        currency:
          type: string
          description: Currency of the order as a whole.
          pattern: '^[A-Z]{3}$'
        status:
          type: string
          description: State of the order when it was accepted.
          enum: [new, processing, shipped, delivered]
    TraceEntry:
      type: object
      description: One downstream call made by the saga.
      required: [step, status, startedAt, finishedAt, durationMs]
      properties:
        step:
          type: string
          description: Which call this was. The last two values are compensation calls.
          enum: [payment, inventory, shipping, notification, inventory_release, payment_refund]
        status:
          type: string
          description: How the call ended.
          enum: [success, failed, timeout]
        startedAt:
          type: string
          description: When the call was sent.
          format: date-time
        finishedAt:
          type: string
          description: When the answer arrived or the timeout fired.
          format: date-time
        durationMs:
          type: integer
          description: Elapsed time in whole milliseconds.
          minimum: 0
    CheckoutCompleted:
      type: object
      description: The result of a saga in which every step succeeded.
      required: [orderId, status, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: Always completed for this response.
          enum: [completed]
        trace:
          type: array
          description: The four forward calls in the order they ran.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceEntry"
    CheckoutFailure:
      type: object
      description: The result of a saga that did not complete.
      required: [orderId, status, code, trace]
      properties:
        orderId:
          type: string
          description: The orderId from the request.
          minLength: 1
        status:
          type: string
          description: compensated when every completed step was undone, failed otherwise.
          enum: [failed, compensated]
        code:
          type: string
          description: >-
            Why the saga stopped. It is timeout, compensation_failed, or the
            code the failing downstream service returned, for example
            payment_declined.
          minLength: 1
        message:
          type: string
          description: A readable explanation for a developer. Callers must not parse it.
        trace:
          type: array
          description: Every call made, in order, with the compensation calls at the end. At most 4 forward calls and 2 compensations.
          maxItems: 6
          items:
            $ref: "#/components/schemas/TraceEntry"
    ErrorResponse:
      type: object
      description: The body of a request that was rejected before or instead of running the saga.
      required: [code, message]
      properties:
        code:
          type: string
          description: A stable machine-readable reason.
          enum: [validation_error, idempotency_payload_mismatch, idempotency_conflict]
        message:
          type: string
          description: A readable explanation for a developer.
          minLength: 1